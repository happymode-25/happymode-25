name: blog

# Disabled by default: there is no blog feed configured yet. Add a repo secret
# named BLOG_FEED (an RSS/Atom URL) and this becomes active. Without the secret
# the job exits 0 instead of failing, so it never leaves a red X on the profile.

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: false

jobs:
  latest-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: skip when feed is not configured
        id: gate
        env:
          BLOG_FEED: ${{ secrets.BLOG_FEED }}
        run: |
          if [ -z "$BLOG_FEED" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "BLOG_FEED secret not set; skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch latest post
        id: fetch
        if: steps.gate.outputs.configured == 'true'
        env:
          BLOG_FEED: ${{ secrets.BLOG_FEED }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$BLOG_FEED" -o /tmp/feed.xml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, html
          import xml.etree.ElementTree as ET

          raw = open("/tmp/feed.xml", "rb").read()
          root = ET.fromstring(raw)

          def strip_ns(tag):
              return tag.rsplit("}", 1)[-1]

          item = None
          for node in root.iter():
              if strip_ns(node.tag) in ("item", "entry"):
                  item = node
                  break

          title, link = "untitled", "#"
          if item is not None:
              for child in item:
                  name = strip_ns(child.tag)
                  if name == "title" and child.text:
                      title = html.unescape(child.text.strip())
                  elif name == "link":
                      href = child.attrib.get("href")
                      link = (href or (child.text or "").strip()) or link
                  elif name == "link" and child.text:
                      link = child.text.strip()

          def emit(label, value):
              value = value.replace("\n", " ").strip() or "#"
              print(f"{label}<<EOF")
              print(value)
              print("EOF")

          emit("title", title)
          emit("link", link)
          PY

      - name: write latest post file
        if: steps.gate.outputs.configured == 'true'
        env:
          TITLE: ${{ steps.fetch.outputs.title }}
          LINK: ${{ steps.fetch.outputs.link }}
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo "<!-- generated by .github/workflows/blog.yml; do not edit -->"
            echo "### latest post"
            echo
            echo "**${TITLE}** - ${LINK}"
          } > docs/latest-post.md
          echo "wrote docs/latest-post.md"
